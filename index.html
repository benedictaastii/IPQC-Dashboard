    <title>Power BI TV Monitoring</title>

    <style>

        /* =========================================
           RESET
        ========================================== */

        *{

            margin:0;
            padding:0;

            box-sizing:border-box;

        }

        html,
        body{

            width:100%;
            height:100%;

            overflow:hidden;

            background:black;

            font-family:Arial, sans-serif;

        }

        /* =========================================
           CONTAINER
        ========================================== */

        .dashboard-container{

            position:relative;

            width:100vw;
            height:100vh;

            overflow:hidden;

        }

        /* =========================================
           SLIDE
        ========================================== */

        .slide{

            position:absolute;

            top:0;
            left:0;

            width:100%;
            height:100%;

            opacity:0;

            visibility:hidden;

            transition:opacity .5s linear;

        }

        .slide.active{

            opacity:1;

            visibility:visible;

            z-index:1;

        }

        /* =========================================
           IFRAME
        ========================================== */

        iframe{

            width:100%;
            height:100%;

            border:none;

            background:black;

        }

        /* =========================================
           VIDEO CONTAINER
        ========================================== */

        #videoContainer{

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background:black;

            display:none;

            justify-content:center;
            align-items:center;

            z-index:9999;

        }

        /* =========================================
           VIDEO
        ========================================== */

        #loopVideo{

            width:100%;
            height:100%;

            object-fit:cover;

        }

    </style>

</head>

<!-- =========================================
     VIDEO SCREEN
========================================== -->

<div id="videoContainer">

    <video
        id="loopVideo"
        playsinline
        controls>

        <source src="video.mp4"
                type="video/mp4">

    </video>

</div>

<script>

    /* =========================================
       ELEMENT
    ========================================== */

    const slides =
        document.querySelectorAll(".slide");

    const videoContainer =
        document.getElementById("videoContainer");

    const loopVideo =
        document.getElementById("loopVideo");

    /* =========================================
       CONFIG
    ========================================== */

    // GANTI SLIDE SETIAP 2 MENIT
    const slideDuration = 2 * 60 * 1000;

    // VIDEO MUNCUL SETELAH 29 MENIT
    const videoInterval = 29 * 60 * 1000;

    /* =========================================
       VARIABLE
    ========================================== */

    let currentSlide = 0;

    let totalElapsed = 0;

    /* =========================================
       SHOW SLIDE
    ========================================== */

    function showSlide(index){

        slides.forEach(slide => {

            slide.classList.remove("active");

        });

        slides[index].classList.add("active");

    }

    /* =========================================
       NEXT SLIDE
    ========================================== */

    function nextSlide(){

        // JIKA VIDEO SEDANG AKTIF
        if(videoContainer.style.display === "flex"){

            return;

        }

        // NEXT INDEX
        currentSlide++;

        // RESET KE AWAL
        if(currentSlide >= slides.length){

            currentSlide = 0;

        }

        // TAMPILKAN SLIDE
        showSlide(currentSlide);

        // HITUNG TOTAL WAKTU
        totalElapsed += slideDuration;

        // JIKA SUDAH 29 MENIT
        if(totalElapsed >= videoInterval){

            showVideo();

        }

    }

    /* =========================================
       SHOW VIDEO
    ========================================== */

    function showVideo(){

        // TAMPILKAN VIDEO
        videoContainer.style.display = "flex";

        // VIDEO DARI AWAL
        loopVideo.currentTime = 0;

        // AKTIFKAN SUARA
        loopVideo.muted = false;

        // PLAY VIDEO
        loopVideo.play().catch(error => {

            console.log("Autoplay blocked:", error);

        });

    }

    /* =========================================
       VIDEO END
    ========================================== */

    loopVideo.addEventListener("ended", () => {

        // HIDE VIDEO
        videoContainer.style.display = "none";

        // RESET TIMER
        totalElapsed = 0;

    });

    /* =========================================
       START
    ========================================== */

    showSlide(currentSlide);

    /* =========================================
       AUTO SLIDE
    ========================================== */

    setInterval(() => {

        nextSlide();

    }, slideDuration);

    /* =========================================
       AUTO REFRESH
       REFRESH SETIAP 30 MENIT
    ========================================== */

    setInterval(() => {

        location.reload();

    }, 1800000);

</script>
