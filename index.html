<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Power BI TV Dashboard</title>

    <style>

        /* =========================================
           RESET
        ========================================== */

        *{

            margin:0;
            padding:0;

            box-sizing:border-box;

        }

        html,
        body{

            width:100%;
            height:100%;

            overflow:hidden;

            background:black;

            font-family:Arial, sans-serif;

        }

        /* =========================================
           CONTAINER
        ========================================== */

        .dashboard-container{

            position:relative;

            width:100vw;
            height:100vh;

            overflow:hidden;

        }

        /* =========================================
           SLIDE PANEL
        ========================================== */

        .slide{

            position:absolute;

            width:100%;
            height:100%;

            top:0;
            left:0;

            opacity:0;

            visibility:hidden;

            transition:opacity .5s linear;

        }

        .slide.active{

            opacity:1;

            visibility:visible;

            z-index:1;

        }

        /* =========================================
           IFRAME
        ========================================== */

        iframe{

            width:100%;
            height:100%;

            border:none;

            background:black;

        }

        /* =========================================
           VIDEO CONTAINER
        ========================================== */

        #videoContainer{

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background:black;

            display:none;

            justify-content:center;
            align-items:center;

            z-index:9999;

        }

        /* =========================================
           VIDEO
        ========================================== */

        #loopVideo{

            width:100%;
            height:100%;

            object-fit:cover;

        }

        /* =========================================
           PROGRESS BAR
        ========================================== */

        #progressBar{

            position:fixed;

            bottom:0;
            left:0;

            width:0%;

            height:4px;

            background:lime;

            z-index:99999;

        }

    </style>

</head>

    <!-- =========================================
         VIDEO FULLSCREEN
    ========================================== -->

    <div id="videoContainer">

        <video
            id="loopVideo"
            autoplay
            playsinline>

            <source src="video.mp4"
                    type="video/mp4">

        </video>

    </div>

    <!-- =========================================
         PROGRESS BAR
    ========================================== -->

    <div id="progressBar"></div>

</div>

<script>

    /* =========================================
       ELEMENT
    ========================================== */

    const slides =
        document.querySelectorAll(".slide");

    const videoContainer =
        document.getElementById("videoContainer");

    const loopVideo =
        document.getElementById("loopVideo");

    const progressBar =
        document.getElementById("progressBar");

    /* =========================================
       CONFIG
    ========================================== */

    // 45 DETIK PER SLIDE
    const slideDuration = 45000;

    // VIDEO MUNCUL SETELAH 29 MENIT
    const videoInterval = 2 * 60 * 1000;

    /* =========================================
       VARIABLE
    ========================================== */

    let currentSlide = 0;

    let totalElapsed = 0;

    /* =========================================
       SHOW SLIDE
    ========================================== */

    function showSlide(index){

        slides.forEach(slide => {

            slide.classList.remove("active");

        });

        slides[index].classList.add("active");

    }

    /* =========================================
       NEXT SLIDE
    ========================================== */

    function nextSlide(){

        // JIKA VIDEO AKTIF
        if(videoContainer.style.display === "flex"){

            return;

        }

        currentSlide++;

        if(currentSlide >= slides.length){

            currentSlide = 0;

        }

        showSlide(currentSlide);

        totalElapsed += slideDuration;

        startProgressBar();

        // TAMPILKAN VIDEO
        if(totalElapsed >= videoInterval){

            showVideo();

        }

    }

    /* =========================================
       SHOW VIDEO
    ========================================== */

    function showVideo(){

        videoContainer.style.display = "flex";

        loopVideo.currentTime = 0;

        loopVideo.play().catch(error => {

            console.log(error);

        });

    }

    /* =========================================
       VIDEO END
    ========================================== */

    loopVideo.addEventListener("ended", () => {

        videoContainer.style.display = "none";

        totalElapsed = 0;

    });

    /* =========================================
       PROGRESS BAR
    ========================================== */

    function startProgressBar(){

        progressBar.style.transition = "none";

        progressBar.style.width = "0%";

        setTimeout(() => {

            progressBar.style.transition =
                `width ${slideDuration}ms linear`;

            progressBar.style.width = "100%";

        }, 50);

    }

    /* =========================================
       START
    ========================================== */

    showSlide(currentSlide);

    startProgressBar();

    /* =========================================
       AUTO SLIDE
    ========================================== */

    setInterval(() => {

        nextSlide();

    }, slideDuration);

    /* =========================================
       AUTO REFRESH 30 MENIT
    ========================================== */

    setInterval(() => {

        location.reload();

    }, 1800000);

</script>
